name: 📖 Update Technical Documentation

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'   # don't re-trigger when docs themselves are updated

permissions:
  contents: write

jobs:
  update-docs:
    name: Refresh architecture.html
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 20   # enough history for the commit list

      - name: Refresh the auto-generated commit list
        env:
          REPO: ${{ github.repository }}
        run: python3 .github/scripts/update_docs.py

      - name: Commit updated docs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/architecture.html
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: auto-update architecture.html [skip ci]"
            git push
          fi
